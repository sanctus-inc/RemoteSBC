# X draws into a copy of the screen in ordinary cached memory and copies the changed parts to the display buffer.
# Without it (the modesetting driver's default once glamor is refused) X draws straight into the display buffer,
# which on this board is uncached: every read of the screen, by X's own drawing or by screenserve's MIT-SHM
# read-back, ran at memory-uncached speed (about 85 ms for a full 1920x1080 read).
# AccelMethod none: glamor is refused on the software GL anyway ("Refusing to try glamor on llvmpipe").
Section "Device"
	Identifier "display"
	Driver "modesetting"
	Option "ShadowFB" "on"
	Option "AccelMethod" "none"
EndSection
